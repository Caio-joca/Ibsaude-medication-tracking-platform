services:
  - type: web
    name: ibsaude
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app db upgrade
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /login
    disk:
      name: ibsaude-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ibsaude-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: BACKUP_FOLDER
        value: /var/data/backups
      - key: PYTHON_VERSION
        value: 3.13.7

databases:
  - name: ibsaude-db
    databaseName: ibsaude
    user: ibsaude
