{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Novo' }} usuário | IBSAÚDE{% endblock %}
{% block content %}
<h1 class="h3">{{ 'Editar' if usuario else 'Novo' }} usuário</h1>
<form method="POST" class="card card-body shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nome" value="{{ request.form.get('nome', usuario.nome if usuario else '') }}" required></div>
        <div class="col-md-6"><label class="form-label">CPF</label><input class="form-control" name="cpf" value="{{ request.form.get('cpf', usuario.cpf if usuario else '') }}" required></div>
        <div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" value="{{ request.form.get('email', usuario.email if usuario else '') }}" required></div>
        <div class="col-md-6"><label class="form-label">Senha {{ '(deixe vazia para manter)' if usuario else '' }}</label><input class="form-control" type="password" name="senha" {{ 'required' if not usuario else '' }}></div>
        <div class="col-md-6"><label class="form-label">Perfil</label><select class="form-select" name="perfil" required>{% set atual=request.form.get('perfil', usuario.perfil if usuario else '') %}{% for valor,rotulo in [('A','Administrador'),('F','Farmacêutico'),('G','Gestor'),('U','Auditor')] %}<option value="{{ valor }}" {{ 'selected' if atual==valor else '' }}>{{ rotulo }}</option>{% endfor %}</select></div>
        {% if usuario %}<div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="ativo"><option value="1" {{ 'selected' if usuario.ativo else '' }}>Ativo</option><option value="0" {{ 'selected' if not usuario.ativo else '' }}>Inativo</option></select></div>{% endif %}
    </div>
    <div class="mt-3"><button class="btn btn-success">Salvar</button> <a class="btn btn-secondary" href="{{ url_for('usuarios.listar') }}">Voltar</a></div>
</form>
{% endblock %}
